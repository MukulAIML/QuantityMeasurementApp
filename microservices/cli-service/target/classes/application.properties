spring.application.name=cli-service

# API Gateway base URL (override via env var in deployment)
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}

# Spring Shell banner
spring.shell.interactive.enabled=true
spring.shell.command.version.enabled=false

# Disable Spring Boot web server (this is a CLI app, not a server)
spring.main.web-application-type=none

# Logging (keep console clean in interactive mode)
logging.level.root=WARN
logging.level.com.apps.cli=INFO
